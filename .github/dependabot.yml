version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cron: "37 3 11 * *"
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    versioning-strategy: increase

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cron: "17 4 23 * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 30
